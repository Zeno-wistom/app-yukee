<!doctype html><html><body style="margin:0;background:#000">
<!-- 开发用：G03 场景绘制基准。每帧绘制后读取 1 像素强制栅格化，统计帧绘制耗时分布。
     /scripts/sun-surf-bench.html?w=1920&h=940&n=240 ；结果写入 window.result -->
<canvas id="c"></canvas>
<script type="module">
import { drawSunSurf, layoutFor } from "/src/games/sunSurfScene.ts";
const q = new URLSearchParams(location.search);
const c = document.getElementById("c");
c.width = +(q.get("w") || 1920); c.height = +(q.get("h") || 940);
const ctx = c.getContext("2d");
const img = new Image();
img.src = "/art/g03-sunlit-castle.png";
await img.decode();
const assets = { img, off: { c: null } };
const L = layoutFor(c.width, c.height);
const n = +(q.get("n") || 240), times = [];
for (let i = 0; i < n + 20; i++) {
  const t = i / 60, u = Math.sin(t * 1.3);
  const reps = Math.min(6, Math.floor(i / 40));
  const s = { t, x: L.cx + u * L.laneDX, u, target: i % 80 < 40 ? -1 : 1, approach: Math.abs(u), hold: 0.5, arrived: Math.abs(u) > 0.5, returning: false, reps, complete: reps >= 6, catchT: Math.floor(i / 40) * 40 / 60, catchSide: -1, spawnT: 0, completeT: 4, tracking: "ok" };
  const a = performance.now();
  drawSunSurf(ctx, s, assets);
  ctx.getImageData(0, 0, 1, 1);
  const d = performance.now() - a;
  if (i >= 20) times.push(d);
}
times.sort((a, b) => a - b);
const pct = p => times[Math.floor((times.length - 1) * p)].toFixed(2);
window.result = { mean: (times.reduce((a, b) => a + b, 0) / times.length).toFixed(2), p50: pct(0.5), p95: pct(0.95), max: pct(1) };
window.done = true;
</script></body></html>
